<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Pro | My Courses</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header" onclick="window.location.href='index.html'" style="cursor:pointer">
            <div class="logo-icon"><i data-lucide="graduation-cap"></i></div>
            <div class="logo-text">SyllabusPro</div>
        </div>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-nav">
            <div class="nav-item" onclick="window.location.href='index.html'"><i data-lucide="layout-dashboard"></i> Dashboard</div>
            <div class="nav-item active"><i data-lucide="book-open"></i> Courses</div>
            <div class="nav-item" onclick="window.location.href='chatbot.html'"><i data-lucide="message-square"></i> AI Assistant</div>
            <div class="nav-item" onclick="window.location.href='settings.html'"><i data-lucide="settings"></i> Settings</div>
        </nav>

        <div class="user-profile" onclick="toggleProfileMenu(event)">
            <div class="profile-circle" id="profile-initials">??</div>
            <div class="user-info">
                <div class="user-name" id="user-display-name">Loading...</div>
                <div class="user-role">Student Account</div>
            </div>
            <i data-lucide="more-vertical" style="width:16px; color:var(--text-dim)"></i>
            <div class="profile-menu" id="profile-menu">
                <button onclick="logoutWithConfirm()"><i data-lucide="log-out"></i> Sign Out</button>
                <button onclick="deleteAccountWithConfirm()" class="danger"><i data-lucide="trash-2"></i> Delete Data</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div class="header-text">
                <h1>My Courses</h1>
                <p>Manage and view all your enrolled courses</p>
            </div>
        </header>

        <section class="content-section">
            <div class="course-grid" id="course-grid">
                <!-- Courses will be rendered here -->
            </div>
        </section>

        <footer class="clean-footer">
            <p>© 2026 Chandra Bhushan Singh</p>
        </footer>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const Store = {
            getUsers: () => JSON.parse(localStorage.getItem('syllabus_pro_users') || '[]'),
            saveUsers: (users) => localStorage.setItem('syllabus_pro_users', JSON.stringify(users)),
            getActiveUser: () => JSON.parse(localStorage.getItem('syllabus_pro_active')),
            setActiveUser: (user) => localStorage.setItem('syllabus_pro_active', JSON.stringify(user)),
            clearActiveUser: () => localStorage.removeItem('syllabus_pro_active'),
            getTheme: () => localStorage.getItem('syllabus_pro_theme') || 'light',
            setTheme: (theme) => {
                localStorage.setItem('syllabus_pro_theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            }
        };

        // Initialize Theme
        Store.setTheme(Store.getTheme());

        let currentUser = Store.getActiveUser();

        window.onload = function () {
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            updateUI();
            renderCourses();
            lucide.createIcons();

            // Link settings nav item
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.innerText.includes('Settings')) {
                    item.onclick = () => window.location.href = 'index.html?openSettings=true';
                }
            });
        }

        function updateUI() {
            document.getElementById('user-display-name').innerText = currentUser.username;
            const name = currentUser.username || "User";
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            document.getElementById('profile-initials').innerText = initials || '??';
        }

        function renderCourses() {
            const grid = document.getElementById('course-grid');
            grid.innerHTML = '';

            if (!currentUser.summaries || currentUser.summaries.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); margin-top: 2rem;">here is not any course yet.</p>';
                return;
            }

            currentUser.summaries.forEach((course, index) => {
                const nextDeadline = course.events.length > 0 ? course.events[0] : null;
                const card = document.createElement('div');
                card.className = 'course-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.onclick = () => openDetails(course.id);
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteSummary(${course.id}, event)"><i data-lucide="trash-2" style="width:12px; height:12px;"></i> Delete</button>
                    <div class="course-card-header">
                        <span class="course-code">${course.code}</span>
                        <div class="modality-tag" style="font-size: 0.6rem; padding: 2px 8px;">${course.modality || 'In-person'}</div>
                    </div>
                    <div class="course-title">${course.title}</div>
                    
                    <div class="course-card-meta">
                        <div class="meta-item">
                            <i data-lucide="user"></i>
                            <span class="value">${course.instructor || 'TBD'}</span>
                        </div>
                        <div class="meta-item">
                            <i data-lucide="clock"></i>
                            <span class="value">${course.timeAndPlace || 'TBD'}</span>
                        </div>
                    </div>

                    ${nextDeadline ? `
                    <div class="next-deadline-box">
                        <span class="next-deadline-label">Next Deadline</span>
                        <span class="next-deadline-value">${nextDeadline.date}: ${nextDeadline.name}</span>
                    </div>
                    ` : ''}

                    <div style="display:flex; gap:10px; margin-top:auto;">
                        <button class="view-btn" onclick="openDetails(${course.id})"><i data-lucide="eye"></i> Summary</button>
                        <button class="view-btn highlight-btn" style="background:var(--accent-gradient); color:#fff; border:none;" onclick="generateStudyPlan(${course.id}, event)"><i data-lucide="zap"></i> Roadmap</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function generateStudyPlan(id, e) {
            if (e) e.stopPropagation();
            const course = currentUser.summaries.find(c => c.id === id);
            if (!course) return;

            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="modal-header">
                    <span class="course-code">${course.code}</span>
                    <h2>AI Study Roadmap</h2>
                    <p>Strategic plan for ${course.title}</p>
                </div>

                <div style="display:flex; flex-direction:column; gap:20px;">
                    <div style="background:var(--accent-glow); padding:1.5rem; border-radius:20px; border:1px solid var(--border); display:flex; gap:15px; align-items:center;">
                        <i data-lucide="zap" style="color:var(--warning); width:32px; height:32px;"></i>
                        <p style="font-size:0.9rem; font-weight:600;">Our LPU engine has analyzed your grading breakdown. Focus on high-weight components to maximize your GPA.</p>
                    </div>

                    <div style="display:grid; gap:15px;">
                        <div style="border-left:4px solid var(--accent); padding-left:15px;">
                            <h4 style="font-size:0.9rem; margin-bottom:5px;">Phase 1: Foundation</h4>
                            <p style="font-size:0.8rem; color:var(--text-dim);">Master basic concepts. Priority: Attendance & Participation (${course.grading.find(g => /att|part/i.test(g.name))?.weight || '10'}%)</p>
                        </div>
                        <div style="border-left:4px solid var(--warning); padding-left:15px;">
                            <h4 style="font-size:0.9rem; margin-bottom:5px;">Phase 2: Execution</h4>
                            <p style="font-size:0.8rem; color:var(--text-dim);">Tackle core assignments. Priority: ${course.grading.find(g => /exam|mid/i.test(g.name))?.name || 'Exams'}</p>
                        </div>
                        <div style="border-left:4px solid var(--danger); padding-left:15px;">
                            <h4 style="font-size:0.9rem; margin-bottom:5px;">Phase 3: Mastery</h4>
                            <p style="font-size:0.8rem; color:var(--text-dim);">Final push and projects. Priority: ${course.grading.find(g => /final|proj/i.test(g.name))?.name || 'Final Deliverables'}</p>
                        </div>
                    </div>
                </div>

                <div style="margin-top:2rem; padding-top:1rem; border-top:1px solid var(--border);">
                    <button class="confirm-btn" onclick="document.getElementById('modal-overlay').style.display='none'"><i data-lucide="check"></i> Optimize My Schedule</button>
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            lucide.createIcons();
        }

        function openDetails(id) {
            const course = currentUser.summaries.find(c => c.id === id);
            if (!course) return;
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <div class="modal-header">
                    <span class="course-code">${course.code}</span>
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <h2>${course.title}</h2>
                        <div class="modality-tag">${course.modality || 'In-person'}</div>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label"><i data-lucide="user"></i> Instructor</span>
                        <div class="info-value">${course.instructor || 'TBD'}</div>
                        ${course.email ? `<a href="mailto:${course.email}" class="info-email">
                            <i data-lucide="mail" style="width:12px; height:12px;"></i> ${course.email}
                        </a>` : ''}
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i data-lucide="map-pin"></i> Time and Place</span>
                        <div class="info-value">${course.timeAndPlace || 'TBD'}</div>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i data-lucide="building"></i> Office</span>
                        <div class="info-value">${course.office || 'Check Syllabus'}</div>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><i data-lucide="clock"></i> Office Hour</span>
                        <div class="info-value">${course.officeHours || 'Check Canvas'}</div>
                    </div>
                    ${course.taName ? `
                    <div class="info-item">
                        <span class="info-label"><i data-lucide="users"></i> Teaching Assistant</span>
                        <div class="info-value">${course.taName}</div>
                    </div>` : ''}
                </div>

                <div class="details-grid">
                    <div class="grading-section">
                        <div class="form-section-title">
                            <i data-lucide="bar-chart-3"></i> Grading Breakdown
                        </div>
                        ${course.grading.map(g => `
                            <div class="grading-item-header">
                                <span class="grading-item-name">${g.name}</span>
                                <span class="grading-item-weight">${g.weight}%</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar ${g.weight >= 25 ? 'high-weight' : ''}" style="width:${g.weight}%"></div>
                            </div>
                        `).join('') || '<p style="color:var(--text-dim); font-size: 0.9rem;">No grading info available.</p>'}
                    </div>

                    <div class="deadline-list-compact">
                        <div class="form-section-title">
                            <i data-lucide="alert-circle"></i> Key Deadlines
                        </div>
                        <div style="display:flex; flex-direction:column; gap:12px;">
                            ${(course.events || []).map(e => `
                                <div class="compact-deadline">
                                    <div class="date-pill">${e.date}</div>
                                    <div class="title">${e.name}</div>
                                </div>
                            `).join('') || '<p style="color:var(--text-dim); font-size: 0.9rem;">No upcoming deadlines.</p>'}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            lucide.createIcons();
        }

        function deleteSummary(id, e) {
            e.stopPropagation();
            if (!confirm('Delete this syllabus?')) return;
            
            currentUser.summaries = currentUser.summaries.filter(s => s.id !== id);
            const users = Store.getUsers();
            const userIndex = users.findIndex(u => (u.username === currentUser.username || u.email === currentUser.email));
            users[userIndex] = currentUser;
            Store.saveUsers(users);
            Store.setActiveUser(currentUser);
            renderCourses();
        }

        function toggleProfileMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('profile-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function logoutWithConfirm() {
            if (confirm('Are you sure you want to log out?')) {
                Store.clearActiveUser();
                currentUser = null;
                window.location.href = 'index.html';
            }
        }

        function deleteAccountWithConfirm() {
            if (confirm('CRITICAL: Are you sure you want to delete your account? This action cannot be undone and all your syllabus data will be permanently erased.')) {
                const users = Store.getUsers().filter(u => u.username !== currentUser.username);
                Store.saveUsers(users);
                Store.clearActiveUser();
                currentUser = null;
                window.location.href = 'index.html';
            }
        }

        document.getElementById('close-modal').onclick = () => document.getElementById('modal-overlay').style.display = 'none';
        window.onclick = (e) => { if(e.target.id === 'modal-overlay') document.getElementById('modal-overlay').style.display = 'none'; }
    </script>
</body>
</html>
