<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Pro | Student Dashboard</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --modal-bg: #0f172a;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #f43f5e;
            --warning: #fbbf24;
            --glass: blur(12px) saturate(180%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar - Glassmorphism */
        .sidebar {
            width: 340px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: var(--glass);
            border-right: 1px solid var(--border);
            padding: 2.5rem;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 2rem;
        }

        .deadline-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .deadline-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .deadline-date {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .deadline-title {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .deadline-course {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 4rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(to bottom right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .course-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .course-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .course-card:hover::before { opacity: 1; }

        .course-code {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .course-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            line-height: 1.3;
            min-height: 4rem;
        }

        .view-btn {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .view-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        /* Modal - Advanced Design */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            border-radius: 32px;
            padding: 4rem;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .close-modal {
            position: absolute;
            top: 2rem; right: 2rem;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-modal:hover { background: var(--danger); border-color: var(--danger); }

        .modal-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .info-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            display: block;
        }

        .info-value { font-size: 1.1rem; font-weight: 500; }

        .grading-section {
            background: rgba(255,255,255,0.03);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .grading-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .progress-container {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--accent), #60a5fa);
            border-radius: 10px;
        }

        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; }
            .main-content { padding: 2rem; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Schedule & Deadlines</h2>
        <div id="deadline-list"></div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>Syllabus Pro</h1>
            <p>Your academic command center.</p>
        </div>

        <div class="course-grid" id="course-grid"></div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const courseData = [
            {
                id: 0,
                code: "CIS 4250",
                title: "Ethical Issues & Professional Conduct",
                instructor: "Raiyan Abdul Baten, Ph.D.",
                email: "rbaten@usf.edu",
                time: "TR 6:30 pm - 7:45 pm",
                location: "CWY 107",
                officeHours: "Tue 9:00 am - 12:00 pm (ENG 116)",
                grading: [
                    { name: "End-of-topic quizzes", weight: 35 },
                    { name: "Participation", weight: 20 },
                    { name: "Final project", weight: 35 },
                    { name: "Final exam", weight: 10 }
                ],
                events: [
                    { name: "Final Project (Written)", date: "2025-11-25", type: "project" },
                    { name: "Final Project (Video)", date: "2025-12-01", type: "project" },
                    { name: "Final Exam", date: "2025-12-11", type: "exam" }
                ]
            },
            {
                id: 1,
                code: "COT 4400",
                title: "Analysis of Algorithms",
                instructor: "Oguzhan Topsakal, Ph.D.",
                email: "topsakal@usf.edu",
                time: "M, W 5:00 pm – 6:15 pm",
                location: "ISA 1061",
                officeHours: "MW 3:30-4:30 pm (BEH-317), Tue 2:30-4:30 pm (Teams)",
                grading: [
                    { name: "Exams", weight: 60 },
                    { name: "Homework", weight: 20 },
                    { name: "Project(s)", weight: 10 },
                    { name: "Participation", weight: 10 }
                ],
                events: [
                    { name: "Exam 1", date: "2024-02-23", type: "exam" },
                    { name: "Exam 2", date: "2024-03-31", type: "exam" },
                    { name: "Project Part 1 Due", date: "2024-10-21", type: "project" },
                    { name: "Project Part 3 Due", date: "2024-11-18", type: "project" }
                ]
            },
            {
                id: 2,
                code: "COP 4600",
                title: "Operating Systems",
                instructor: "Mauricio Pamplona Segundo",
                email: "mauriciop@usf.edu",
                time: "T, R 6:30 pm - 7:45 pm",
                location: "CHE 103 / CPR 115",
                officeHours: "Check Canvas",
                grading: [
                    { name: "Midterms", weight: 40 },
                    { name: "Final Exam", weight: 30 },
                    { name: "Projects", weight: 25 },
                    { name: "Attendance Quizzes", weight: 5 }
                ],
                events: [
                    { name: "Project #1 Due", date: "2025-02-13", type: "project" },
                    { name: "Midterm #1", date: "2025-02-15", type: "exam" },
                    { name: "Project #2 Due", date: "2025-03-27", type: "project" },
                    { name: "Midterm #2", date: "2025-03-29", type: "exam" },
                    { name: "Project #3 Due", date: "2025-05-01", type: "project" }
                ]
            }
        ];

        function openModal(id) {
            const course = courseData.find(c => c.id === id);
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="modal-header">
                    <span class="course-code">${course.code}</span>
                    <h2>${course.title}</h2>
                </div>
                <div class="info-grid">
                    <div>
                        <span class="info-label">Instructor</span>
                        <div class="info-value">${course.instructor}</div>
                        <div class="info-value" style="color:var(--accent); font-size: 0.9rem">${course.email}</div>
                    </div>
                    <div>
                        <span class="info-label">Meeting Times</span>
                        <div class="info-value">${course.time}</div>
                        <div class="info-value">${course.location}</div>
                    </div>
                    <div>
                        <span class="info-label">Office Hours</span>
                        <div class="info-value">${course.officeHours}</div>
                    </div>
                </div>
                <div class="grading-section">
                    <span class="info-label">Grading Breakdown</span>
                    ${course.grading.map(g => `
                        <div class="grading-item">
                            <span>${g.name}</span>
                            <span style="font-weight:700">${g.weight}%</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width:${g.weight}%"></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function render() {
            const grid = document.getElementById('course-grid');
            const list = document.getElementById('deadline-list');
            let events = [];

            courseData.forEach((course, index) => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.onclick = () => openModal(course.id);
                card.innerHTML = `
                    <span class="course-code">${course.code}</span>
                    <div class="course-title">${course.title}</div>
                    <button class="view-btn">Full Syllabus</button>
                `;
                grid.appendChild(card);
                course.events.forEach(e => events.push({...e, code: course.code}));
            });

            events.sort((a,b) => new Date(a.date) - new Date(b.date));
            events.forEach((e, i) => {
                const item = document.createElement('div');
                item.className = 'deadline-item';
                item.style.animationDelay = `${i * 0.1}s`;
                item.innerHTML = `
                    <div class="deadline-date">${new Date(e.date).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</div>
                    <div class="deadline-title">${e.name}</div>
                    <div class="deadline-course">${e.code}</div>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('close-modal').onclick = () => document.getElementById('modal-overlay').style.display = 'none';
        window.onclick = (e) => { if(e.target.id === 'modal-overlay') document.getElementById('modal-overlay').style.display = 'none'; }
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
